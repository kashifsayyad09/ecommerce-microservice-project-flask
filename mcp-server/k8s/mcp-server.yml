# mcp-server: internal-only tool layer between the AI agent and the
# existing backend API. No SQL, no AWS/K8s API access, no external ingress.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: microservices
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: microservices
data:
  PORT: "8100"
  LOG_LEVEL: "INFO"
  BACKEND_BASE_URL: "http://backend-service"
  BACKEND_TIMEOUT_SECONDS: "8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-deployment
  namespace: microservices
  labels:
    app: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: 932431569521.dkr.ecr.us-east-1.amazonaws.com/shopping-site-mcp-server:0c83a601c22c0d0c761f4e4f1006f41733bf6a2e
          ports:
            - containerPort: 8100
          envFrom:
            - configMapRef:
                name: mcp-server-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: microservices
spec:
  selector:
    app: mcp-server
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
  type: ClusterIP
---
# Only ai-agent may reach mcp-server; mcp-server may only reach the backend
# (and DNS). Adjust podSelector labels to match your CNI/ingress setup if
# they differ.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-allow-ai-agent-only
  namespace: microservices
spec:
  podSelector:
    matchLabels:
      app: mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ai-agent
      ports:
        - protocol: TCP
          port: 8100
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5000
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
