# Example Kubernetes Secret for the backend service.
#
# DO NOT commit a real version of this file. Copy it, fill in real values,
# and apply it out-of-band (kubectl apply -f, or a secrets manager /
# External Secrets Operator in production), e.g.:
#
#   kubectl create secret generic backend-secrets \
#     --namespace microservices \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32)
#
# JWT_SECRET is the new value required by the AI assistant: it is what the
# backend uses to sign the customer token returned from /api/login/*, and
# what it uses to verify requests coming from the ai-agent / mcp-server on
# a customer's behalf.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: microservices
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-value"
  DB_PASSWORD: "replace-with-the-real-rds-password"
  MAIL_PASSWORD: "replace-with-the-real-app-password"
