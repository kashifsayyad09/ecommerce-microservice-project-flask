# Example Kubernetes Secret for ai-agent. DO NOT commit a real version.
#
#   kubectl create secret generic ai-agent-secrets \
#     --namespace microservices \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=OPENROUTER_API_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secrets
  namespace: microservices
type: Opaque
stringData:
  GROQ_API_KEY: "replace-with-real-groq-key"
  OPENROUTER_API_KEY: "replace-with-real-openrouter-key"
  ANTHROPIC_API_KEY: "replace-with-real-anthropic-key"
