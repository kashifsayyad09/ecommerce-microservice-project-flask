# ai-agent: internal-only. Talks to mcp-server, backend, and the external
# AI provider APIs. Not exposed via Ingress -- the frontend calls it
# through the backend/ingress path (see frontend/main/ingress.yml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-sa
  namespace: microservices
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: microservices
data:
  PORT: "8200"
  LOG_LEVEL: "INFO"
  MCP_SERVER_URL: "http://mcp-server-service:8100/mcp/"
  MCP_TOOL_TIMEOUT_SECONDS: "10"
  BACKEND_BASE_URL: "http://backend-service"
  AUTH_TIMEOUT_SECONDS: "5"
  AI_REQUEST_TIMEOUT: "25"
  AI_MAX_RETRIES: "1"
  RATE_LIMIT_PER_MINUTE: "20"
  CORS_ALLOWED_ORIGINS: "*"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  OPENROUTER_MODEL: "meta-llama/llama-3.3-70b-instruct"
  OPENROUTER_SITE_URL: "https://veeraops-ecommerce.example.com"
  CLAUDE_MODEL: "claude-sonnet-4-6"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-deployment
  namespace: microservices
  labels:
    app: ai-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      serviceAccountName: ai-agent-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-agent
          image: 695454131301.dkr.ecr.us-east-1.amazonaws.com/shopping-site-ai-agent:latest
          ports:
            - containerPort: 8200
          envFrom:
            - configMapRef:
                name: ai-agent-config
            - secretRef:
                name: ai-agent-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
  namespace: microservices
spec:
  selector:
    app: ai-agent
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-agent-network-policy
  namespace: microservices
spec:
  podSelector:
    matchLabels:
      app: ai-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the frontend/backend tier (or ingress-nginx, if you choose to
    # expose /api/ai directly) may call ai-agent.
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mcp-server
      ports:
        - protocol: TCP
          port: 8100
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5000
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS to Groq / OpenRouter / Anthropic.
    - to: []
      ports:
        - protocol: TCP
          port: 443
