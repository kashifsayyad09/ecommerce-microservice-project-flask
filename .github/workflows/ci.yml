name: CI/CD for Shopping Site (Frontend + Backend)


on:
  workflow_dispatch:

  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  
  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"
  BACKEND_SERVICE: "backend"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}

      # -------------------------
      # AWS Credentials
      # -------------------------
      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # ECR Login
      # -------------------------
      - name: 📦 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Unit tests (new AI/MCP services)
      # -------------------------
      - name: 🧪 Run ai-agent & mcp-server unit tests
        run: |
          set -e
          python3 -m pip install --quiet -r ai-agent/requirements.txt -r mcp-server/requirements.txt
          python3 -m pip install --quiet pytest pytest-asyncio
          PYTHONPATH=ai-agent python3 -m pytest tests/ai_agent -q
          PYTHONPATH=mcp-server python3 -m pytest tests/mcp_server -q

      # -------------------------
      # Build & Push Images
      # -------------------------
      - name: 🛠 Build and Push Docker Images
        run: |
          set -e
          IMAGE_TAG="${GITHUB_SHA}"

          # -------- Frontend --------
          for service in $FRONTEND_SERVICES; do
            FOLDER="frontend/$service"
            REPO_NAME="shopping-site-$service"
            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

            if [ ! -f "$FOLDER/Dockerfile" ]; then
              echo "⚠️ No Dockerfile in $FOLDER, skipping..."
              continue
            fi

            echo "🚀 Building $service"

            aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
              aws ecr create-repository \
                --repository-name $REPO_NAME \
                --image-scanning-configuration scanOnPush=true

            docker build -t $IMAGE_URI $FOLDER
            docker push $IMAGE_URI

            sed -i "s|image:.*|image: $IMAGE_URI|g" "$FOLDER/deployment.yml"
          done

          # -------- Backend --------
          FOLDER="backend"
          REPO_NAME="shopping-site-backend"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "🚀 Building backend"

          aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name $REPO_NAME \
              --image-scanning-configuration scanOnPush=true

          docker build -t $IMAGE_URI $FOLDER
          docker push $IMAGE_URI

          sed -i "s|image:.*|image: $IMAGE_URI|g" "$FOLDER/backend-deployment.yml"

          # -------- mcp-server --------
          FOLDER="mcp-server"
          REPO_NAME="shopping-site-mcp-server"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "🚀 Building mcp-server"

          aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name $REPO_NAME \
              --image-scanning-configuration scanOnPush=true

          docker build -t $IMAGE_URI $FOLDER
          docker push $IMAGE_URI

          sed -i "s|image:.*|image: $IMAGE_URI|g" "$FOLDER/k8s/mcp-server.yml"

          # -------- ai-agent --------
          FOLDER="ai-agent"
          REPO_NAME="shopping-site-ai-agent"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "🚀 Building ai-agent"

          aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name $REPO_NAME \
              --image-scanning-configuration scanOnPush=true

          docker build -t $IMAGE_URI $FOLDER
          docker push $IMAGE_URI

          sed -i "s|image:.*|image: $IMAGE_URI|g" "$FOLDER/k8s/ai-agent.yml"

      # -------------------------
      # Basic security checks (new services)
      # -------------------------
      - name: 🔒 Python dependency & lint check (ai-agent, mcp-server)
        run: |
          set -e
          python3 -m pip install --quiet pip-audit
          for svc in ai-agent mcp-server; do
            echo "Auditing $svc"
            python3 -m pip install --quiet -r "$svc/requirements.txt" --dry-run || true
            python3 -m pip_audit -r "$svc/requirements.txt" || echo "⚠️ pip-audit found issues in $svc (non-blocking)"
          done

      # -------------------------
      # Commit YAML changes
      # -------------------------
      - name: 🔄 Commit updated YAML files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add frontend/**/deployment.yml backend/backend-deployment.yml mcp-server/k8s/mcp-server.yml ai-agent/k8s/ai-agent.yml
          git commit -m "🔄 Update image tags after build [skip ci]" || echo "No changes"
          git push origin main || echo "Nothing to push"

      
      # -------------------------
      # Prevent CI loop
      # -------------------------
      - name: 🧠 Skip loop if commit was automated
        if: contains(github.event.head_commit.message, '[skip ci]')
        run: echo "Skipping re-triggered build"
